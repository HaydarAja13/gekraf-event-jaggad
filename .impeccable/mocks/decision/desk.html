<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Meja Pendaftaran</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;overflow:hidden;color:#fff;font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    background:radial-gradient(900px 620px at 78% -6%,rgba(2,153,195,.55),transparent 62%),
               radial-gradient(700px 480px at 6% 106%,rgba(242,203,25,.18),transparent 60%),
               linear-gradient(158deg,#062b36 0%,#0b0e16 68%)}
  .ray{position:absolute;left:56%;top:6%;width:70%;height:2px;background:linear-gradient(90deg,transparent,rgba(242,203,25,.85),transparent);transform:rotate(-27deg);transform-origin:left center}
  .ray.two{top:16%;opacity:.5;width:52%}
  .nav{position:relative;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;z-index:3}
  .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
  .mark{width:32px;height:32px;border-radius:9px;background:#0299c3;display:grid;place-items:center;font-size:11px;font-weight:800}
  .pill{background:#f2cb19;color:#0b0e16;border-radius:999px;padding:11px 24px;font-size:15px;font-weight:800}
  .stage{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-start;padding:26px 60px 0;gap:0}
  /* ---- flyer, standing A4 sheet ---- */
  .flyer{width:336px;aspect-ratio:210/297;background:#fff;color:#0b0e16;border-radius:4px;transform:rotate(-3deg);transform-origin:bottom right;
    box-shadow:0 34px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
  .tape{position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-2deg);width:118px;height:26px;background:rgba(242,203,25,.72);border-radius:2px}
  .flyer-top{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.12em;padding:14px 15px 9px}
  .flyer-mark{width:20px;height:20px;border-radius:6px;background:#0299c3;color:#fff;display:grid;place-items:center;font-size:8px}
  .flyer-band{background:#f2cb19;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:8px 15px}
  .flyer h1{font-family:"Playfair Display",serif;font-size:40px;line-height:1;padding:20px 15px 0;font-weight:800}
  .flyer h1 em{font-style:normal;color:#0299c3}
  .flyer-info{margin:18px 15px 0;background:#0299c3;color:#fff;border-radius:13px;padding:14px}
  .flyer-info b{display:block;font-size:13.5px;font-weight:800}
  .flyer-info span{display:block;font-size:11.5px;opacity:.85;margin:2px 0 9px}
  .flyer-foot{margin-top:auto;padding:12px 15px;font-size:11px;color:#8a919c;text-align:center;border-top:1px dashed #dfe4e8}
  .a4tag{position:absolute;right:12px;bottom:46px;background:#0b0e16;color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;border-radius:999px;padding:5px 10px}
  /* ---- registration sheet ---- */
  .form{width:648px;background:#fff;color:#0b0e16;border-radius:6px;margin-left:-34px;transform:rotate(1.1deg);transform-origin:top left;
    box-shadow:0 40px 70px rgba(0,0,0,.6);position:relative;z-index:2;padding:30px 34px 26px}
  .clip{position:absolute;top:-16px;right:52px;width:34px;height:34px;border:4px solid #f2cb19;border-radius:999px;border-bottom-color:transparent;transform:rotate(38deg)}
  .form small{font-size:12.5px;font-weight:800;letter-spacing:.16em;color:#0299c3;text-transform:uppercase}
  h2{font-size:29px;font-weight:800;letter-spacing:-.015em;margin-top:8px}
  .sub{margin-top:6px;font-size:14.5px;color:#686866}
  .plan{display:flex;align-items:center;justify-content:space-between;margin-top:18px;background:#f0f1f5;border-radius:16px;padding:14px 18px}
  .plan small{color:#686866}
  .plan b{font-size:19px;font-weight:800;display:block;margin-top:3px}
  .price{text-align:right}
  .was{font-size:14px;color:#f0301f;text-decoration:line-through;font-weight:700}
  .now{font-size:26px;font-weight:800;color:#0299c3;display:block}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px;margin-top:20px}
  .f{display:block;font-size:13.5px;font-weight:700}
  .f.wide{grid-column:1/-1}
  .f input,.f textarea{margin-top:6px;width:100%;border:1px solid #dfe4e8;border-radius:11px;background:#fbfcfd;padding:11px 13px;font:inherit;font-weight:600;font-size:15px;color:#8a919c}
  .f textarea{height:58px;resize:none}
  .send{margin-top:20px;display:flex;align-items:center;justify-content:space-between}
  .btn{background:#f2cb19;border-radius:999px;padding:15px 34px;font-size:17px;font-weight:800;box-shadow:0 10px 26px rgba(242,203,25,.35)}
  .hint{font-size:13px;color:#686866;max-width:230px;line-height:1.5}
</style>
</head>
<body>
  <div class="ray"></div><div class="ray two"></div>
  <div class="nav">
    <div class="brand"><span class="mark">BSM</span> Business Skill Mastery</div>
    <div class="pill">Daftar Sekarang →</div>
  </div>
  <div class="stage">
    <figure class="flyer">
      <span class="tape"></span>
      <div class="flyer-top"><span class="flyer-mark">BSM</span> BUSINESS SKILL MASTERY</div>
      <div class="flyer-band">National Business Growth Class</div>
      <h1>Business<br>Skill<br><em>Mastery</em></h1>
      <div class="flyer-info"><b>Sabtu, 21 November 2026</b><span>08.00 – 12.30 WIB</span><b>Gets Hotel Semarang</b><span>Semarang, Jawa Tengah</span></div>
      <div class="flyer-foot">Pamflet acara · ganti dengan poster resmi</div>
      <span class="a4tag">A4 · 210×297</span>
    </figure>
    <section class="form">
      <span class="clip"></span>
      <small>Formulir Pendaftaran</small>
      <h2>Amankan kursi Anda</h2>
      <p class="sub">Isi data pemesan, lalu transfer sesuai nominal di samping.</p>
      <div class="plan">
        <div><small>PAKET</small><b>EARLYBIRD</b></div>
        <div class="price"><span class="was">Rp 1.499.000</span><span class="now">Rp 999.000</span></div>
      </div>
      <div class="fields">
        <label class="f wide">Nama lengkap<input value="Budi Santoso"></label>
        <label class="f">Email<input value="budi@perusahaan.co.id"></label>
        <label class="f">WhatsApp<input value="0822 4198 9936"></label>
        <label class="f">Instansi<input value="PT Maju Bersama"></label>
        <label class="f">Jabatan<input value="Direktur"></label>
      </div>
      <div class="send">
        <span class="btn">Kirim Pendaftaran →</span>
        <p class="hint">Bukti transfer diunggah di langkah berikutnya, sebelum form dikirim.</p>
      </div>
    </section>
  </div>
</body>
</html>
